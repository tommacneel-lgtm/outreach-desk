<title>Outreach Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column. Talent tabs on top, one command bar, a pipeline strip that filters, then brands grouped by stage. Secondary actions sit in ⋯ menus. */
:root{
  --bg:#f1f4f3; --panel:#ffffff; --ink:#14211d; --mute:#5c6b66; --line:#d5dcd9; --soft:#e7ecea;
  --accent:#0b6b5c; --accent-ink:#ffffff; --plum:#7a2e63;
  --good:#1f7a45; --warn:#9a6200; --bad:#b3322b; --warn-bg:#fbf1dc; --bad-bg:#fbe6e4; --good-bg:#e1f2e7; --plum-bg:#f3e4ee;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101614; --panel:#18211e; --ink:#e6eeea; --mute:#93a39d; --line:#2c3935; --soft:#212c28;
  --accent:#4fc2ab; --accent-ink:#06211c; --plum:#e29ccb;
  --good:#6fd195; --warn:#e6b455; --bad:#f08a82; --warn-bg:#3a2e12; --bad-bg:#3d1c1a; --good-bg:#173524; --plum-bg:#3a2233;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#101614; --panel:#18211e; --ink:#e6eeea; --mute:#93a39d; --line:#2c3935; --soft:#212c28;
  --accent:#4fc2ab; --accent-ink:#06211c; --plum:#e29ccb;
  --good:#6fd195; --warn:#e6b455; --bad:#f08a82; --warn-bg:#3a2e12; --bad-bg:#3d1c1a; --good-bg:#173524; --plum-bg:#3a2233;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 30px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h2{font:700 13px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12px var(--mono);padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--mute);background:var(--panel);display:inline-flex;gap:6px;align-items:center}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.chip.ok i{background:var(--good)} .chip.err i{background:var(--bad)} .chip.run i{background:var(--warn)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.tab{font:600 15px var(--body);padding:9px 14px;border:0;background:none;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab small{font:500 12px var(--mono);color:var(--mute);margin-left:6px}
button{font:600 14px var(--body);border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;cursor:pointer}
button:hover{border-color:var(--mute)} button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.sm{font-size:12.5px;padding:5px 9px} button.ghost{border-color:transparent;background:none;color:var(--mute)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:14px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.bar .sp{flex:1 1 20px}
.bar input[type=number]{width:62px} .bar input[type=text]{flex:1 1 160px}
.note{color:var(--mute);font-size:13px}
.msg{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.msg.bad{background:var(--bad-bg)} .msg.good{background:var(--good-bg)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>h2{display:flex;gap:8px;align-items:baseline} .sec>h2 span{font:500 12px var(--mono);letter-spacing:0;text-transform:none}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 14px;align-items:center}
.bn{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;min-width:0}
.bn b{font:700 18px/1.2 var(--display)} .bn .why{color:var(--mute);font-size:13.5px;flex:1 1 220px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname{all:unset;cursor:pointer;display:inline-flex;gap:7px;align-items:baseline;border-radius:4px} .bname:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bname .cv{font:500 12px var(--mono);color:var(--mute);display:inline-block;transition:transform .15s} .bname[aria-expanded="true"] .cv{transform:rotate(90deg)}
.brand.k-reply,.brand.k-send{border-left:4px solid var(--plum)} .brand.k-draft,.brand.k-find{border-left:4px solid var(--accent)} .brand.k-talk{border-left:4px solid var(--good)}
.sec>h2 button{all:unset;cursor:pointer;font:500 12px var(--mono);letter-spacing:0;text-transform:none;color:var(--accent)}
.bact{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}
.fall{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font:500 12px var(--mono);color:var(--mute)}
.pips{display:flex;gap:3px;align-items:center}
.pip{width:15px;height:9px;border-radius:2px;background:var(--soft);border:1px solid var(--line)}
.pip.drafted{background:var(--warn);border-color:var(--warn)} .pip.emailed{background:var(--accent);border-color:var(--accent)}
.pip.replied{background:var(--plum);border-color:var(--plum)} .pip.bounced{background:var(--bad);border-color:var(--bad)}
.pips .gap{width:7px}
.state{font:600 12.5px var(--body);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink)}
.state.reply{background:var(--plum-bg);color:var(--plum)} .state.send,.state.hold{background:var(--warn-bg);color:var(--warn)}
.state.draft,.state.find,.state.talk{background:var(--good-bg);color:var(--good)}
.cs{border-top:1px solid var(--line);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13.5px}
th{font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td .t{color:var(--mute);font-size:12.5px} td input{font:12.5px var(--mono);width:100%;padding:5px 7px}
.pill{font:600 11.5px var(--body);padding:2px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill.drafted{background:var(--warn-bg);color:var(--warn)} .pill.emailed{background:var(--good-bg);color:var(--good)}
.pill.replied{background:var(--plum-bg);color:var(--plum)} .pill.bounced{background:var(--bad-bg);color:var(--bad)}
a{color:var(--accent)}
details.prof{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details.prof summary{cursor:pointer;font-weight:600} details.prof textarea{width:100%;min-height:150px;margin-top:10px;box-sizing:border-box}
.log{font:12px/1.6 var(--mono);color:var(--mute);max-height:170px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.review{background:var(--panel);border:2px solid var(--accent);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.review h2{color:var(--ink)} .review p{margin:0;color:var(--mute);max-width:70ch}
.mail{border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.mail summary{cursor:pointer} .mail .t{color:var(--mute);font-size:12.5px}
.mail .mb{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.mail pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 var(--body);background:var(--soft);border-radius:6px;padding:12px;max-width:72ch}
.rb{display:flex;flex-wrap:wrap;gap:8px}
.empty{padding:26px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}
/* Pipeline strip: one segment per stage, click to filter the list */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg{all:unset;box-sizing:border-box;cursor:pointer;padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);border-bottom:3px solid transparent;min-width:0}
.seg:last-child{border-right:0}
.seg:hover{background:var(--soft)} .seg:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.seg b{font:700 24px/1 var(--display);color:var(--ink)} .seg span{font:600 12px var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg em{font:500 11.5px var(--mono);font-style:normal;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.you b{color:var(--plum)} .seg.pitch b{color:var(--accent)} .seg.wait b{color:var(--warn)} .seg.talk b{color:var(--good)} .seg.bnc b{color:var(--bad)}
.seg[aria-pressed="true"]{background:var(--soft);border-bottom-color:var(--accent)} .seg.zero b{color:var(--line)}
.bar .grow{flex:1 1 20px}
/* Overflow menus: secondary actions live here instead of in rows of buttons */
details.menu{position:relative} details.menu>summary{list-style:none;cursor:pointer;font:700 15px/1 var(--body);color:var(--mute);border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--panel);display:inline-flex;gap:6px;align-items:center;user-select:none}
details.menu>summary::-webkit-details-marker{display:none} details.menu>summary:hover{border-color:var(--mute)} details.menu[open]>summary{border-color:var(--accent);color:var(--ink)}
details.menu>summary .dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.mpop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.14);display:flex;flex-direction:column}
.mpop button,.mpop a.mi{all:unset;box-sizing:border-box;cursor:pointer;font:500 14px var(--body);color:var(--ink);padding:8px 10px;border-radius:6px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.mpop button:hover,.mpop a.mi:hover,.mpop button:focus-visible,.mpop a.mi:focus-visible{background:var(--soft)} .mpop button:disabled{opacity:.45;cursor:default;background:none}
.mpop button.danger{color:var(--bad)} .mpop hr{border:0;border-top:1px solid var(--soft);margin:5px 4px}
.mpop .row{display:flex;gap:6px;align-items:center;padding:2px 4px} .mpop .row button{flex:1}
.mpop small{font:500 12px var(--mono);color:var(--mute)}
@media (max-width:640px){ .bh{grid-template-columns:minmax(0,1fr)} .bact{justify-content:flex-start} h1{font-size:25px} .pipe{grid-template-columns:repeat(3,minmax(0,1fr))} .seg:nth-child(3){border-right:0} .seg:nth-child(-n+3){border-top:0} .seg{border-top:1px solid var(--line)} .bact .mpop{left:0;right:auto} }
@media (prefers-reduced-motion:no-preference){ .chip.run i{animation:bl 1s infinite alternate} @keyframes bl{to{opacity:.25}} }
</style>

<div class="wrap">
  <div class="top">
    <div><h1>Outreach Desk</h1><div class="note" id="sub">Brand partnership outreach, two emails at a time.</div></div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="notice"></div>
  <div class="bar" id="bar"></div>
  <div class="pipe" id="pipe" hidden></div>
  <div id="review"></div>
  <div id="list" class="wrap" style="gap:22px"><div class="empty">Loading your pipeline…</div></div>
  <details class="prof" id="prof"></details>
  <details class="prof"><summary>Activity this visit</summary><div class="log" id="log" style="margin-top:10px">Nothing yet. Press a button above.</div></details>
</div>

<script>
const GMAIL="Gmail", MONDAY="monday.com", BROWSER="host:claude_browser";
const DAY=86400000;
const S={talents:{},brands:{},settings:{},cur:null,open:new Set(),busy:{},notice:null,loaded:false,
  chips:{gmail:{s:"",t:"Gmail: not checked yet"},monday:{s:"",t:"monday.com"},li:{s:"",t:"LinkedIn: untested"}}};
let db=null,mcp=null,sample=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD=t=>t>1e11?new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"";
const today=()=>new Date().toISOString().slice(0,10);
const cfg=()=>Object.assign({waitDays:3,batch:2,brandCount:5,sender:"",agency:"",style:""},S.settings||{});
const logLines=[];
function log(m){logLines.unshift(new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+"  "+m);$("log").textContent=logLines.slice(0,40).join("\n")}
function notice(text,kind){S.notice=text?{text,kind:kind||""}:null;renderNotice()}
function chip(k,s,t){S.chips[k]={s,t};renderChips()}

/* ---------- errors ---------- */
function mcpMsg(e,server){
  const c=e&&e.code, n=server===BROWSER?"the Claude browser pane":server;
  if(server===BROWSER&&(c==="server_not_connected"||c==="not_granted"||c==="capability_disabled"))return "LinkedIn steps only work when this page is open inside the Claude desktop app.";
  if(c==="needs_reauth")return "Reconnect "+n+" in claude.ai Settings → Connectors, then try again.";
  if(c==="server_not_connected"||c==="selection_required")return "Add "+n+" in claude.ai Settings → Connectors, then try again.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required"||c==="not_granted")return n+" isn't allowed for this page yet. Press the button again and choose Allow.";
  if(c==="blocked_by_policy")return "Your organization blocks "+n+" for this page.";
  if(c==="cancelled")return "Cancelled.";
  if(c==="server_unavailable")return n+" didn't answer. Try again in a moment.";
  if(c==="tool_error")return n+" reported a problem: "+String(e.message||"").slice(0,200);
  return "Something went wrong with "+n+": "+String((e&&e.message)||e).slice(0,200);
}
function sampleMsg(e){
  const c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled")return "Claude isn't allowed on this page. Reload and choose Allow when asked.";
  if(c==="rate_limited")return "Claude usage limit reached. Try again later.";
  if(c==="invalid_json")return "Claude's answer came back malformed. Press the button again.";
  if(c==="refused")return "Claude declined that request.";
  return "Claude couldn't finish that: "+String((e&&e.message)||e).slice(0,160);
}
async function call(server,tool,input){
  if(!mcp)throw {code:"capability_disabled",message:"Connectors unavailable in this view"};
  return mcp.callTool(server,tool,input,{cache:false});
}
function textOf(r){
  if(!r)return "";
  if(typeof r.payload==="string")return r.payload;
  const t=(r.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  return t||(r.payload?JSON.stringify(r.payload):"");
}
function objOf(r){const p=r&&r.payload;if(p&&typeof p==="object")return p;try{return JSON.parse(textOf(r))}catch(e){return {}}}

/* ---------- data ---------- */
const chain={};
function saveBrand(b){
  b.updatedAt=Date.now();
  const body=JSON.parse(JSON.stringify(b));delete body.id;
  S.brands[b.id]=b;fmtCache={};render();
  if(!db)return Promise.resolve();
  chain[b.id]=(chain[b.id]||Promise.resolve()).then(()=>db.doc("brands/"+b.id).set(body)).catch(e=>{
    notice(e.code==="quota_exceeded"?"The app's storage is full. Remove old brands to save new ones.":"Couldn't save "+b.name+" ("+(e.code||"error")+"). Your change shows here but may not be kept.","bad")});
  return chain[b.id];
}
function brandsOf(tid){return Object.values(S.brands).filter(b=>b.talentId===tid&&!b.archived)}
const handledAt=x=>Math.max(x.lastMineAt||0,x.successAt||0);
const needs=x=>x.stage==="replied"&&(x.replyAt||0)>handledAt(x);
function chainTxt(x){
  const s=x.seen||[],t=s.filter(k=>k[0]==="t").length,m=s.length-t,first=x.name.split(" ")[0],last=Math.max(x.replyAt||0,x.lastMineAt||0);
  return (s.length?m+" from you · "+t+" from "+first+" · ":"")+(needs(x)?first+" wrote last"+(fmtD(x.replyAt)?" on "+fmtD(x.replyAt):"")+", your turn":"you wrote last"+(fmtD(last)?" on "+fmtD(last):"")+", waiting on "+first);
}
/* replies from people at the company who are not on the contact list */
const firstSentAt=b=>Math.min(Infinity,...(b.contacts||[]).map(x=>x.emailedAt>1e11?x.emailedAt:Infinity));
const coAll=b=>{const f=firstSentAt(b);return (b.inbound||[]).filter(m=>m.at>(b.inboundIgnoreAt||0)&&m.at>=f)};
const coNeeds=b=>coAll(b).filter(m=>!m.answered&&m.at>(b.inboundSuccessAt||0));
/* the same company under another creator */
const normName=s=>String(s||"").toLowerCase().replace(/^the\s+/,"").replace(/[^a-z0-9]/g,"");
function domsOf(b){const s=new Set();if(b.domain&&!FREE.test(b.domain))s.add(b.domain);(b.contacts||[]).forEach(x=>{const d=addr(x.email).split("@")[1];if(d&&!FREE.test(d))s.add(d)});return s}
function respondedAt(b){let t=b.closed?(b.closedAt||1):0;(b.contacts||[]).forEach(x=>{if(x.stage==="replied")t=Math.max(t,x.replyAt||1)});coAll(b).forEach(m=>{t=Math.max(t,m.at)});return t}
function heldBy(b){
  const mine=domsOf(b),n=normName(b.name);
  for(const o of Object.values(S.brands)){
    if(o.id===b.id||o.archived||o.talentId===b.talentId)continue;
    if(normName(o.name)!==n&&![...domsOf(o)].some(d=>mine.has(d)))continue;
    const t=respondedAt(o);if(t&&t>(b.holdOverrideAt||0))return o;
  }
  return null;
}
/* ---------- address check: free, from what your Gmail and past sends already show (no paid checker) ---------- */
let fmtCache={};
const domOf=x=>addr(x.email).split("@")[1]||"";
const guessed=x=>!!x.email&&/^(Likely|Guessed|Corrected|Checked|Test)/.test(x.emailNote||"");
function fmtStats(dom){ /* how each address format has done at a company, across every creator's brands */
  if(fmtCache[dom])return fmtCache[dom];
  const st={},add=(p,k)=>{if(p)(st[p]=st[p]||{ok:0,bad:0})[k]++};
  for(const b of Object.values(S.brands)){
    for(const x of b.contacts||[]){
      if(domOf(x)===dom){const p=patOf(x);
        if(x.stage==="bounced")add(p,/inactive|full/.test(x.bounceReason||"")?"ok":"bad");
        else if(x.stage==="replied"||(x.stage==="emailed"&&Date.now()-(x.emailedAt||0)>DAY))add(p,"ok")}
      (x.tried||[]).forEach(t=>{if(addr(t).split("@")[1]===dom)add(patOf({name:x.name,email:t}),"bad")});
    }
    const g=b.formatSeen;if(g&&g.domain===dom&&g.pattern)add(g.pattern,"ok");
  }
  return fmtCache[dom]=st;
}
function provenPat(dom){const st=fmtStats(dom);return Object.keys(st).filter(p=>st[p].ok&&!st[p].bad).sort((a,b)=>st[b].ok-st[a].ok)[0]||""}
function testPending(dom){ /* a guessed email at this company drafted, or sent less than a day ago, with no answer yet */
  let t=null;
  for(const b of Object.values(S.brands))for(const x of b.contacts||[]){
    if(domOf(x)!==dom||!guessed(x))continue;
    const live=x.stage==="drafted"||x.stage==="sending"||(x.stage==="emailed"&&Date.now()-(x.emailedAt||0)<=DAY);
    if(live&&(!t||(x.emailedAt||Infinity)>(t.emailedAt||Infinity)))t=x;
  }
  return t;
}
function nextTestPat(dom,pref){const st=fmtStats(dom);return [pref].concat(PATS).find(p=>p&&!(st[p]&&st[p].bad))||""}
/* before drafting: look in Gmail for real people at the company to learn its format, then fix guesses to match */
async function checkAddresses(b){
  const open=x=>(!x.stage||x.stage==="found")&&!x.skip&&guessed(x);
  const doms=[...new Set((b.contacts||[]).filter(open).map(domOf).filter(d=>d&&!FREE.test(d)))];let ch=false;
  for(const d of doms){
    const g=b.formatSeen;
    if(!provenPat(d)&&!(g&&g.domain===d&&Date.now()-(g.checkedAt||0)<7*DAY)){
      try{
        const r=objOf(await call(GMAIL,"search_threads",{query:"from:"+d+" -from:me newer_than:730d",pageSize:25})),cnt={};
        for(const th of r.threads||[])for(const m of th.messages||[]){

function mkEmail(name,domain,pattern){

  if(p.length<2||!domain)return "";
  const f=p[0],l=p[p.length-1].replace(/-/g,"");if(l.length<2)return "";
  const m={"first.last":f+"."+l,"flast":f[0]+l,"firstlast":f+l,"first":f,"first_last":f+"_"+l,"firstl":f+l[0],"last.first":l+"."+f,"f.last":f[0]+"."+l,"lastf":l+f[0],"first.l":f+"."+l[0],"lastfirst":l+f};

}

/* ---------- bounces: learn which address format works at each company ---------- */
const PATS=["first.last","flast","firstlast","first","first_last","firstl","last.first","f.last","lastf","first.l","lastfirst"];
function patOf(x){const d=addr(x.email).split("@")[1];if(!d)return "";for(const p of PATS)if(mkEmail(x.name,d,p)===addr(x.email))return p;return ""}
function bounceWhy(s){
  s=String(s||"").toLowerCase();
  if(/temporary problem|will retry|delivery incomplete/.test(s))return "";
  if(/inactive|disabled/.test(s))return "account inactive, the person has likely left";
  if(/inbox is full|inbox full/.test(s))return "their inbox is full";
  if(/not found|couldn.t be found|5\.1\.1|user unknown/.test(s))return "address not found";
  if(/blocked|rejected|5\.7\.|5\.4\./.test(s))return "rejected by their mail server, which usually means the address doesn't exist";
  return "not delivered";
}
function fixFormats(b){
  const st={},key=x=>{const d=addr(x.email).split("@")[1],p=patOf(x);return d&&p?d+"|"+p:""};let ch=false;
  for(const x of b.contacts||[]){const k=key(x);if(!k)continue;const s=st[k]=st[k]||{ok:0,bad:0};
    if(x.stage==="bounced"){if(!/inactive|full/.test(x.bounceReason||""))s.bad++}
    else if(x.stage==="replied"||(x.stage==="emailed"&&Date.now()-(x.emailedAt||0)>DAY))s.ok++}
  for(const x of b.contacts||[]){
    const k=key(x),s=st[k];if(!s||!s.bad||s.ok||!(x.stage==="found"||x.stage==="bounced"||!x.stage))continue;
    const d=k.split("|")[0],good=PATS.find(q=>st[d+"|"+q]&&st[d+"|"+q].ok>=2&&!st[d+"|"+q].bad);
    if(good){const ne=mkEmail(x.name,d,good),old=addr(x.email);
      if(ne&&ne!==old&&!(x.tried||[]).includes(ne)){x.tried=(x.tried||[]).concat(old);x.email=ne;x.emailNote="Corrected to the "+good+" format that works at "+d+" (was "+old+")";x.stage="found";delete x.skip;delete x.bounceReason;ch=true}}
    else if((x.stage==="found"||!x.stage)&&!x.skip&&s.bad>=2){x.skip=true;x.emailNote="On hold: this address format has bounced "+s.bad+" times at "+d+". Type a verified address to include this person";ch=true}
  }
  return ch;
}

/* ---------- Gmail: watch for sends, replies, bounces ---------- */
const addr=s=>{const m=String(s||"").toLowerCase().match(/[a-z0-9._%+'-]+@[a-z0-9.-]+\.[a-z]{2,}/);return m?m[0]:""};
const FREE=/^(gmail|yahoo|hotmail|outlook|icloud|aol|googlemail)\./;
const NO_RE=/not interested|no interest|not a fit|pass (on|at)|not (currently )?(looking|working with|taking)|no budget|unsubscribe|remove me/i;
const AUTO=/no-?reply|do-?not-?reply|newsletter|notification|bounce|mailer|postmaster/;
let firstSync=true,syncP=null,lastSyncOk=0;
function syncGmail(manual){if(!mcp)return Promise.resolve();if(!syncP)syncP=doSync(manual).finally(()=>{syncP=null});return syncP}
async function doSync(manual){
  S.busy.sync=1;chip("gmail","run","Gmail: checking…");render();
  try{
    const span=firstSync?"60d":"10d",pages=firstSync?8:2;
    const pull=async q=>{let out=[],tok="";for(let i=0;i<pages;i++){const r=objOf(await call(GMAIL,"search_threads",Object.assign({query:q,pageSize:50},tok?{pageToken:tok}:{})));out=out.concat(r.threads||[]);tok=r.nextPageToken;if(!tok)break}return out};
    const sentT=await pull("in:sent newer_than:"+span), inT=await pull("-from:me newer_than:"+span);
    let bT=[];try{bT=objOf(await call(GMAIL,"search_threads",{query:"from:(mailer-daemon OR postmaster) newer_than:"+span,pageSize:50,includeTrash:true,view:"THREAD_VIEW_SUMMARY"})).threads||[]}catch(e){}
    const dr=objOf(await call(GMAIL,"list_drafts",{pageSize:50}));
    const draftTo=new Set();(dr.drafts||[]).forEach(d=>(d.toRecipients||[]).forEach(a=>draftTo.add(addr(a))));
    const sent={},reply={},bounce={},byDomain={},lastSent={},ids={};
    const why={};for(const th of bT)for(const m of th.messages||[]){const w=bounceWhy((m.subject||"")+" "+(m.snippet||""));if(!w)continue;const mine=(m.toRecipients||[]).map(addr),at=Date.parse(m.date)||Date.now();(String(m.snippet||"").toLowerCase().match(/[a-z0-9._%+'-]+@[a-z0-9.-]+\.[a-z]{2,}/g)||[]).forEach(a=>{if(!mine.includes(a)){bounce[a]=at;why[a]=w}})}
    const note=(a,k,at)=>{if(a)(ids[a]=ids[a]||[]).push({k,at})};
    for(const th of sentT.concat(inT))for(const m of th.messages||[]){
      const isSent=(m.labelIds||[]).includes("SENT"),from=addr(m.sender),at=Date.parse(m.date)||Number(m.internalDate)||Date.now();
      if(isSent){(m.toRecipients||[]).forEach(a=>{a=addr(a);if(!a)return;if(!sent[a]||at<sent[a])sent[a]=at;if(!lastSent[a]||at>lastSent[a])lastSent[a]=at;note(a,"m:"+m.id,at)})}
      else if(/mailer-daemon|postmaster/.test(from)){(th.messages||[]).filter(z=>(z.labelIds||[]).includes("SENT")).forEach(z=>(z.toRecipients||[]).forEach(a=>bounce[addr(a)]=at))}
      else if(from){const rec={at,snip:String(m.snippet||"").replace(/&#39;/g,"'").replace(/&amp;/g,"&").replace(/&quot;/g,'"'),url:m.viewUrl||th.viewUrl||"",subject:m.subject||"",from};
        note(from,"t:"+m.id,at);if(!reply[from]||at>reply[from].at)reply[from]=rec;const d=from.split("@")[1];(byDomain[d]=byDomain[d]||[]).push(rec)}
    }
    let changed=0,news=[];
    for(const b of Object.values(S.brands)){
      let dirty=false;const mine=new Set(),doms=new Set();
      for(const x of b.contacts||[]){
        const a=addr(x.email);if(!a)continue;mine.add(a);const d=a.split("@")[1];if(!FREE.test(d))doms.add(d);
        const was=x.stage||"found";let now=was;
        if(sent[a]){if(x.emailedAt!==sent[a]){x.emailedAt=sent[a];dirty=true}if(was==="found"||was==="drafted"||was==="sending")now="emailed"}
        else if(was==="sending"&&Date.now()-(x.sendingAt||0)>180000)now=draftTo.has(a)?"drafted":"found";
        else if(was==="drafted"&&!draftTo.has(a)&&(!x.draftedAt||Date.now()-x.draftedAt>120000))now="found";
        else if(was==="found"&&draftTo.has(a))now="drafted";
        if(bounce[a]&&(sent[a]||x.emailedAt)&&now!=="replied"&&bounce[a]>=(sent[a]||0)-60000){now="bounced";const w=why[a]||x.bounceReason||"not delivered";if(x.bounceReason!==w){x.bounceReason=w;x.emailNote="Bounced: "+w;dirty=true}}
        if(reply[a]&&reply[a].at>=(sent[a]||0)&&reply[a].at>(x.ignoreReplyAt||0)){now="replied";if(x.replyAt!==reply[a].at){x.replyAt=reply[a].at;x.replySnippet=reply[a].snip.slice(0,200);x.replyUrl=reply[a].url;dirty=true;news.push(x.name+" ("+b.name+") replied");if(NO_RE.test(reply[a].snip)&&!b.closed){b.closed=true;b.closedAt=Date.now();b.closedReason="not interested ("+x.name+")";news.push(b.name+" closed automatically: "+x.name+" said no")}}}
        const seen=new Set(x.seen||[]),n0=seen.size;(ids[a]||[]).forEach(z=>{if(z.k[0]==="m"||z.at>(x.ignoreReplyAt||0))seen.add(z.k)});
        if(seen.size!==n0){x.seen=[...seen].slice(-80);dirty=true}
        if(lastSent[a]&&lastSent[a]>(x.lastMineAt||0)){const turned=now==="replied"&&needs(Object.assign({},x,{stage:"replied"}));x.lastMineAt=lastSent[a];dirty=true;if(turned&&lastSent[a]>(x.replyAt||0))news.push("You answered "+x.name+" ("+b.name+"): marked success")}
        if(now!==was){x.stage=now;dirty=true;if(now==="bounced")news.push(x.name+" ("+b.name+") bounced")}
      }
      const old=b.inbound||[],map={};old.forEach(r=>{map[r.from+r.at]=r});
      doms.forEach(d=>(byDomain[d]||[]).forEach(r=>{if(mine.has(r.from)||AUTO.test(r.from))return;const k=r.from+r.at;if(!map[k])map[k]={from:r.from,subject:r.subject.slice(0,120),at:r.at,url:r.url}}));
      const inbound=Object.values(map).map(r=>({from:r.from,subject:r.subject,at:r.at,url:r.url,answered:!!(r.answered||(lastSent[r.from]||0)>r.at)})).sort((x,y)=>y.at-x.at).slice(0,12);
      if(JSON.stringify(inbound)!==JSON.stringify(old)){
        const hadNeed=coNeeds(b).length;b.inbound=inbound;dirty=true;
        if(!hadNeed&&coNeeds(b).length)news.push(coNeeds(b)[0].from+" at "+b.name+" wrote to you: brand paused");
      }
      if(fixFormats(b))dirty=true;
      if(dirty){changed++;await saveBrand(b)}
    }
    firstSync=false;lastSyncOk=Date.now();
    chip("gmail","ok","Gmail: checked "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));
    if(changed||manual)log("Gmail checked: "+(changed?changed+" brand"+(changed>1?"s":"")+" updated":"nothing new")+(news.length?" — "+news.slice(0,6).join("; "):""));
    if(news.length)notice(news.slice(0,4).join(" · "),"good");
  }catch(e){chip("gmail","err","Gmail: not connected");if(manual)notice(mcpMsg(e,GMAIL),"bad")}
  delete S.busy.sync;render();
}

/* ---------- monday.com ---------- */
function findId(r){const s=textOf(r)||JSON.stringify(r||"");const m=s.match(/"id"\s*:\s*"?(\d{6,})/)||s.match(/\b(\d{9,})\b/);return m?Number(m[1]):null}
async function pushMonday(b){
  const M=cfg().monday,t=S.talents[b.talentId];
  if(!M||!M.boardId)return notice("monday.com board details aren't set up for this app yet. Ask Claude to add them.","bad");
  if(!mcp)return notice("monday.com isn't reachable from this view.","bad");
  const set=m=>{S.busy[b.id]=m;render()},p=plan(b),cs=b.contacts||[],L=M.labels||{};
  const rounds=new Set(p.sent.map(x=>new Date(x.emailedAt||0).toDateString())).size;
  const anyLi=cs.some(x=>x.linkedin);
  const status=!p.sent.length?L.none:rounds<=1&&p.sent.length<=cfg().batch?L.round1:anyLi?L.sentLi:L.sent;
  const d=new Date(),stamp=(d.getMonth()+1)+"/"+d.getDate();
  const note=(b.closed?"CLOSED: "+(b.closedReason||"outreach stopped")+" | ":"")+stamp+": "+p.sent.length+" of "+cs.length+" emailed"+(rounds?" over "+rounds+" round"+(rounds>1?"s":""):"")+(p.replied.length?"; replied, our turn: "+p.replied.map(x=>x.name).join(", "):"")+(p.talk.length?"; SUCCESS, in conversation: "+p.talk.map(x=>x.name+" ("+chainTxt(x)+")").join(", "):"")+(p.drafted.length?"; drafts ready: "+p.drafted.map(x=>x.name).join(", "):"")+(p.kind==="wait"?"; next pair due "+fmtD(p.due):"")+(b.why?" | "+b.why:"");
  const bv={[M.cols.notes]:note.slice(0,1900),[M.cols.date]:{date:today()}};if(status)bv[M.cols.status]={label:status};
  try{
    set("Updating monday…");
    if(!b.mondayItemId){
      const id=findId(await call(MONDAY,"create_item",{boardId:M.boardId,groupId:t&&t.mondayGroupId||undefined,name:b.name,columnValues:JSON.stringify(bv)}));
      if(!id)throw {code:"tool_error",message:"the new row was created but its id couldn't be read; check the board before retrying"};
      b.mondayItemId=id;await saveBrand(b);
    }else await call(MONDAY,"change_item_column_values",{boardId:M.boardId,itemId:Number(b.mondayItemId),columnValues:JSON.stringify(bv)});
    let k=0;
    for(const x of cs){
      const st=x.stage==="replied"?M.sub.replied:["emailed","bounced"].includes(x.stage)?(x.linkedin?M.sub.emailedLi:M.sub.emailed):M.sub.none;
      const n=[x.title,x.emailNote,x.stage==="bounced"?"BOUNCED":"",x.stage==="drafted"?"Draft ready":"",x.emailedAt?"Emailed "+fmtD(x.emailedAt):"",x.linkedin?"LinkedIn "+(x.linkedin==="connected"?"connected":"request sent"):"",x.replySnippet?"Reply: "+x.replySnippet.slice(0,120):""].filter(Boolean).join(" | ");
      const v={[M.subCols.email]:x.email||"",[M.subCols.notes]:n.slice(0,1900)};if(st)v[M.subCols.status]={label:st};
      if(x.emailedAt)v[M.subCols.date]={date:new Date(x.emailedAt).toISOString().slice(0,10)};
      const h=JSON.stringify(v);if(x.mondayHash===h&&x.mondayItemId)continue;
      set("Updating monday "+(++k)+"…");
      if(!x.mondayItemId){const id=findId(await call(MONDAY,"create_item",{boardId:M.boardId,parentItemId:Number(b.mondayItemId),name:x.name,columnValues:JSON.stringify(v)}));if(id)x.mondayItemId=id}
      else await call(MONDAY,"change_item_column_values",{boardId:M.subBoardId,itemId:Number(x.mondayItemId),columnValues:JSON.stringify(v)});
      x.mondayHash=h;
    }
    await saveBrand(b);b.mondayAt=Date.now()+500;await saveBrand(b);
    chip("monday","ok","monday: updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}));log(b.name+": monday.com updated ("+k+" contact row"+(k===1?"":"s")+")");
  }catch(e){chip("monday","err","monday: problem");await saveBrand(b);notice(mcpMsg(e,MONDAY)+" Check the board before pressing Update again, so rows aren't doubled.","bad")}
  delete S.busy[b.id];render();
}

/* ---------- events ---------- */
async function runAll(key,kind,fn){
  const list=brandsOf(S.cur).filter(b=>plan(b).kind===kind),fails=[];let streak=0,done=0;
  for(let i=0;i<list.length;i++){
    S.busy[key]=(i+1)+" of "+list.length;notice(null);render();
    await fn(list[i]);
    if(S.notice&&S.notice.kind==="bad"){fails.push(list[i].name+": "+S.notice.text);if(++streak>=2)break}else{streak=0;done++}
  }
  delete S.busy[key];
  if(fails.length)notice("Finished "+done+" of "+list.length+" brands. "+(streak>=2?"Stopped after two failures in a row. ":"")+"Problems: "+fails.slice(0,3).join(" | "),"bad");
  else notice("Done: went through all "+list.length+" brands. Any that had a reply were skipped.","good");
  log((key==="draftAll"?"Draft all":"Find all")+": "+done+" of "+list.length+" brands done");render();
}
/* ⋯ menus: one open at a time, closed by a pick, a click elsewhere or Escape */
function closeMenus(except){document.querySelectorAll("details.menu[open]").forEach(m=>{if(m!==except)m.open=false});if(!except)S.menu=null}
document.addEventListener("toggle",e=>{const m=e.target;if(!m.matches||!m.matches("details.menu"))return;
  if(m.open){S.menu=m.dataset.menu;closeMenus(m)}else if(S.menu===m.dataset.menu)S.menu=null},true);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.menu)closeMenus()});
document.addEventListener("click",e=>{if(S.menu&&!e.target.closest("details.menu"))closeMenus()});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="INPUT")return;
  if(el.closest(".mpop"))closeMenus();
  const a=el.dataset.act,b=S.brands[el.dataset.id],i=Number(el.dataset.i);
  if(a==="tab"){S.cur=el.dataset.id;S.lane=null;render()}
  else if(a==="lane"){const k=el.dataset.lane||null;S.lane=S.lane===k?null:k;render()}
  else if(a==="showDone"){S.showDone=!S.showDone;render()}
  else if(a==="dismiss")notice(null);
  else if(a==="gen")genBrands();
  else if(a==="add")addBrand();
  else if(a==="sync")syncGmail(true);
  else if(a==="refresh")refreshDrafts();
  else if(a==="review")openReview();
  else if(a==="approve")sendBatch();
  else if(a==="stopSend"){S.stopSend=true;el.disabled=true;el.textContent="Stopping…"}
  else if(a==="closeReview"){S.review=null;render()}
  else if(a==="findAll")runAll("findAll","find",findContacts);
  else if(a==="draftAll")runAll("draftAll","draft",draftBrand);
  else if(!b)return;
  else if(a==="toggle"){S.open.has(b.id)?S.open.delete(b.id):S.open.add(b.id);render()}
  else if(a==="find")findContacts(b);
  else if(a==="draft")draftBrand(b);
  else if(a==="monday")pushMonday(b);
  else if(a==="li")liConnect(b,i);
  else if(a==="liMark"){b.contacts[i].linkedin="requested";b.contacts[i].linkedinAt=Date.now();saveBrand(b)}
  else if(a==="skip"){b.contacts[i].skip=!b.contacts[i].skip;saveBrand(b)}
  else if(a==="coSuccess"){b.inboundSuccessAt=Date.now();saveBrand(b);log("Marked the "+b.name+" email as a success")}
  else if(a==="coIgnore"){b.inboundIgnoreAt=Date.now();saveBrand(b);log("Ignored the extra email from "+b.name)}
  else if(a==="close"){const no=(b.contacts||[]).find(x=>x.stage==="replied");b.closed=true;b.closedAt=Date.now();b.closedReason=no?"not interested ("+no.name+")":"stopped by you";saveBrand(b);log("Closed "+b.name)}
  else if(a==="reopen"){delete b.closed;delete b.closedAt;delete b.closedReason;saveBrand(b);log("Reopened "+b.name)}
  else if(a==="skipTest"){b.formatTestSkip=true;saveBrand(b);log("Skipped the format test for "+b.name)}
  else if(a==="useTest"){delete b.formatTestSkip;saveBrand(b);log("Format test back on for "+b.name)}
  else if(a==="unhold"){b.holdOverrideAt=Date.now();saveBrand(b);log("Took "+b.name+" off hold")}
  else if(a==="success"){const x=b.contacts[i];if(x){x.successAt=Date.now();saveBrand(b);log("Marked "+x.name+" ("+b.name+") as a success")}}
  else if(a==="ignore"){const x=b.contacts[i];if(x){x.seen=(x.seen||[]).filter(k=>k[0]==="m");delete x.successAt;x.ignoreReplyAt=Math.max(x.replyAt||0,Date.now());x.stage=x.emailedAt?"emailed":"found";delete x.replyAt;delete x.replySnippet;delete x.replyUrl;saveBrand(b);log("Ignored the reply from "+x.name+" ("+b.name+")")}}
  else if(a==="remove"){delete S.brands[b.id];render();if(db)db.doc("brands/"+b.id).delete().catch(()=>{});log("Removed "+b.name)}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="email"){const b=S.brands[el.dataset.id],x=b&&b.contacts[Number(el.dataset.i)];if(x){x.email=el.value.trim();x.emailNote=x.email?"Edited by hand":"";delete x.skip;delete x.bounceReason;if(x.stage==="bounced")x.stage="found";saveBrand(b)}}
  else if(el.id==="profile"){const t=S.talents[S.cur];if(t&&db){t.profile=el.value;const body=Object.assign({},t);delete body.id;db.doc("talents/"+t.id).set(body).then(()=>log("Saved "+t.name+"'s profile")).catch(()=>notice("Couldn't save the profile.","bad"))}}
  else if(["batch","waitDays","brandCount"].includes(el.id)){const v=Math.max(1,Number(el.value)||1);S.settings=Object.assign({},S.settings,{[el.id]:v});if(db)db.doc("settings/main").set(S.settings).catch(()=>{});render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="addName")addBrand()});

(async function boot(){
  const C=window.claude;
  if(!C||!C.use){S.loaded=true;notice("Open this page inside Claude to use it.","bad");return render()}
  C.use("sample").then(s=>{sample=s});
  C.use("mcp").then(m=>{mcp=m;if(m){syncGmail(false);setInterval(()=>{if(!document.hidden)syncGmail(false)},180000)}else chip("gmail","err","Gmail: unavailable here")});
  db=await C.use("db");
  if(!db){S.loaded=true;notice("This view can't reach the app's saved data. Open it signed in to Claude.","bad");return render()}
  const slow=setTimeout(()=>{if(!S.loaded)notice("Still trying to reach your saved pipeline…")},10000);
  const fail=e=>{clearTimeout(slow);S.loaded=true;notice("Couldn't load saved data ("+(e.code||"error")+").","bad");render()};
  db.collection("talents").onSnapshot(q=>{S.talents={};q.docs.forEach(d=>S.talents[d.id]=Object.assign({id:d.id},d.data()));render()},fail);
  db.doc("settings/signature").onSnapshot(d=>{S.sig=d.exists?d.data():null;render()},()=>{});
  db.doc("settings/main").onSnapshot(d=>{if(d.exists)S.settings=JSON.parse(JSON.stringify(d.data()));render()},()=>{});
  db.collection("brands").limit(1000).onSnapshot(q=>{
    if(!q.metadata.fromCache){clearTimeout(slow);if(!S.loaded&&S.notice&&!S.notice.kind)notice(null);S.loaded=true}
    const next={};q.docs.forEach(d=>{const cur=S.brands[d.id];next[d.id]=d.metadata.hasPendingWrites&&cur?cur:Object.assign(JSON.parse(JSON.stringify(d.data())),{id:d.id})});
    Object.keys(S.busy).forEach(id=>{if(S.brands[id])next[id]=S.brands[id]});
    S.brands=next;render()},fail);
})();
